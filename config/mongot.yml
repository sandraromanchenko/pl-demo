# mongot: syncs from co-located mongod and embeds docs via the OpenAI-compatible
# model catalog (rendered from embedding-service-configs.yml.tmpl).

syncSource:
  replicaSet:
    hostAndPort: mongod:27017
    scramAuth:
      username: __system
      passwordFile: /etc/mongot/secrets/passwordFile
      authSource: local

storage:
  dataPath: /var/lib/mongot

server:
  grpc:
    address: 0.0.0.0:27028
    tls:
      mode: disabled

metrics:
  enabled: false

healthCheck:
  address: 0.0.0.0:8080

logging:
  verbosity: INFO

# Auto-embedding (enabled by this section); catalog rendered at container start.
embedding:
  modelConfigFile: /etc/mongot/embedding-service-configs.yml
  # Single mongot must be the view writer/leader, else auto-embed indexes stay PENDING.
  isAutoEmbeddingViewWriter: true
