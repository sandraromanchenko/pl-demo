syncSource:
  replicaSet:
    hostAndPort: mongod:27017
    scramAuth:
      username: mongot
      passwordFile: /etc/mongot/secrets/passwordFile
      authSource: admin

storage:
  dataPath: /var/lib/mongot

server:
  grpc:
    address: 0.0.0.0:27028
    tls:
      mode: disabled

metrics:
  enabled: true
  address: 0.0.0.0:9946

healthCheck:
  address: 0.0.0.0:8080

logging:
  verbosity: INFO

# Auto-embedding (enabled by this section); catalog rendered at container start
embedding:
  modelConfigFile: /etc/mongot/embedding-service-configs.yml
  isAutoEmbeddingViewWriter: true
