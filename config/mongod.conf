net:
  port: 27017
  bindIpAll: true

replication:
  replSetName: rs

security:
  keyFile: /etc/mongodb/keyfile

setParameter:
  useGrpcForSearch: 1
  mongotHost: mongot:27028
  searchIndexManagementHostAndPort: mongot:27028

storage:
  dbPath: /var/lib/mongo

systemLog:
  destination: file
  path: /var/lib/mongo/mongod.log
  logAppend: true

processManagement:
  fork: false
