server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The "Ask" tab: the RAG assistant (osmc-rag, make osmc-rag-up). The name is resolved per
    # request, so this server starts even when the assistant is not running.
    location /rag/ {
        resolver 127.0.0.11 valid=5s;
        set $rag http://osmc-rag:8090;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass $rag;
        proxy_read_timeout 180s;
    }

    # Long-cache the hashed static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
